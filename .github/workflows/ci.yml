name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 单元测试（${{ matrix.os }} / Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.12']
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      # 测试通过包名导入，检出目录须保持全小写。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: astrbot_plugin_bond
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: 安装测试依赖
        run: python -m pip install -r astrbot_plugin_bond/requirements-test.txt
      - name: 运行测试
        run: python -m pytest astrbot_plugin_bond/tests/ -q
      - name: 页面异步状态回归
        run: node --test astrbot_plugin_bond/tests/dashboard.test.cjs
      - name: 元数据、安全默认值与初始化顺序
        run: python astrbot_plugin_bond/scripts/check_project.py
      - name: 仓库公开内容检查
        run: python astrbot_plugin_bond/scripts/check_repository.py
      - name: 发布包干跑与内容检查
        if: matrix.python-version == '3.12'
        run: python astrbot_plugin_bond/scripts/build_package.py --output "${{ runner.temp }}/bond-check.zip"

  framework:
    name: AstrBot 4.28.0 插件装配
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: astrbot_plugin_bond
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 安装真实框架
        run: python -m pip install AstrBot==4.28.0
      - name: 独立进程验证装配与卸载
        run: >-
          python astrbot_plugin_bond/scripts/smoke_astrbot.py
          --session-dir "${{ runner.temp }}/bond-smoke"
          --runtime-dir "${{ runner.temp }}/bond-smoke/runtime"
      - name: 真实 runner 到离线 Provider 的关系快照
        run: >-
          python astrbot_plugin_bond/scripts/smoke_relation_runner.py
          --runtime-dir "${{ runner.temp }}/bond-relation-runner"
      - name: 真实 OneBot 合成消息元数据
        run: >-
          python astrbot_plugin_bond/scripts/smoke_message_metadata.py
          --session-dir "${{ runner.temp }}/bond-metadata"
      - name: 诊断脱敏、认证与空间隔离
        run: >-
          python astrbot_plugin_bond/scripts/smoke_diagnostics.py
          --runtime-dir "${{ runner.temp }}/bond-diagnostics"

  release:
    needs: [test, framework]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      previous-ref: ${{ github.event.before }}
