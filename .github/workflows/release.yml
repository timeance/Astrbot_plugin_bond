name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的 annotated tag，例如 v0.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          path: astrbot_plugin_bond
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 安装开发检查依赖
        run: python -m pip install -r astrbot_plugin_bond/requirements-dev.txt
      - name: 检查与测试
        run: |
          python astrbot_plugin_bond/scripts/check_project.py
          python -m pytest astrbot_plugin_bond/tests/ -q
          python -m black --check astrbot_plugin_bond
      - name: 验证 tag 并构建发布包
        env:
          TAG_INPUT: ${{ inputs.tag || github.ref_name }}
        run: |
          python astrbot_plugin_bond/scripts/build_package.py \
            --tag "$TAG_INPUT" --output "$RUNNER_TEMP/astrbot_plugin_bond-${TAG_INPUT}.zip"
      - name: 发布 GitHub Release
        working-directory: astrbot_plugin_bond
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag || github.ref_name }}
        run: |
          git for-each-ref "refs/tags/$TAG_INPUT" --format='%(contents)' > "$RUNNER_TEMP/notes.md"
          PRE_ARGS=()
          case "$TAG_INPUT" in *-*) PRE_ARGS+=(--prerelease) ;; esac
          gh release create "$TAG_INPUT" \
            "$RUNNER_TEMP/astrbot_plugin_bond-${TAG_INPUT}.zip" \
            "$RUNNER_TEMP/astrbot_plugin_bond-${TAG_INPUT}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG_INPUT" --notes-file "$RUNNER_TEMP/notes.md" "${PRE_ARGS[@]}"
