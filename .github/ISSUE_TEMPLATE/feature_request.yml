name: 功能建议
description: 说明使用场景、现有限制和希望达到的结果。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议。用虚构对象和人工编写的消息说明场景，不附真实聊天、账号、配置或运行数据。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与问题
      description: 在什么操作或群聊场景中遇到了什么限制？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果
      description: 描述使用者能看到或完成的事情，以及怎样判断问题已解决；不需要提供代码方案。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法（可选）
      description: 现有配置、操作或其他方法能否解决？还缺少什么？
  - type: textarea
    id: impact
    attributes:
      label: 可能的影响（可选）
      description: 如建议涉及已有关系数据、权限、模型调用、外部服务或额外费用，请说明已知影响；不确定可以留空。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开前确认
      options:
        - label: 我已检查正文和附件，不含凭据、真实聊天、账号、群号或运行数据文件。
          required: true
