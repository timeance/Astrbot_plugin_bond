<!DOCTYPE html>
<html lang="zh-CN" data-bond-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bond 关系好感系统</title>
  <script>
    const host = window.AstrBotPluginPage?.getContext?.();
    const dark = typeof host?.isDark === "boolean" ? host.isDark : document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.bondTheme = dark ? "dark" : "light";
  </script>
  <link rel="stylesheet" href="./app.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
