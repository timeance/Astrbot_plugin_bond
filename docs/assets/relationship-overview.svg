<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">三个维度，理解不同的相处状态</title><desc id="desc">熟悉度、亲近度、信任度各分五档，125种状态组合对应75个关系称谓。关系资料供当前人格参考；后台评估与印象更新各自说明，不表示串行执行。</desc><style>text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }</style>
<rect x="1" y="1" width="1198" height="758" rx="18" fill="#EFF3FA" stroke="#CFDCEB"/>
<text x="36" y="43" font-size="14" font-weight="600" fill="#1B4480">BOND · 关系好感系统</text>
<text x="36" y="88" font-size="28" font-weight="700" fill="#10213A">三个维度，理解不同的相处状态</text>
<text x="36" y="119" font-size="16" font-weight="400" fill="#465978">三维分别记录 · 词典解释关系 · 人格决定表达</text>
<rect x="36" y="146" width="360" height="572" rx="12" fill="#FAFCFF" stroke="#CFDCEB"/>
<path d="M56 146h70" stroke="#0E7988" stroke-width="3" stroke-linecap="round"/>
<text x="56" y="180" font-size="20" font-weight="700" fill="#10213A">01  记录三个维度</text>
<text x="56" y="207" font-size="14" font-weight="400" fill="#465978">各有五档，不合成一个总好感分</text>
<rect x="420" y="146" width="360" height="572" rx="12" fill="#FAFCFF" stroke="#CFDCEB"/>
<path d="M440 146h70" stroke="#1B4480" stroke-width="3" stroke-linecap="round"/>
<text x="440" y="180" font-size="20" font-weight="700" fill="#10213A">02  理解当前关系</text>
<text x="440" y="207" font-size="14" font-weight="400" fill="#465978">125 种组合，对应 75 个中文称谓</text>
<rect x="804" y="146" width="360" height="572" rx="12" fill="#FAFCFF" stroke="#CFDCEB"/>
<path d="M824 146h70" stroke="#9E7322" stroke-width="3" stroke-linecap="round"/>
<text x="824" y="180" font-size="20" font-weight="700" fill="#10213A">03  让人格自然表达</text>
<text x="824" y="207" font-size="14" font-weight="400" fill="#465978">关系资料提供背景，不规定台词</text>
<rect x="56" y="232" width="320" height="140" rx="12" fill="#F2F8FA" stroke="#CFDCEB"/>
<text x="72" y="262" font-size="18" font-weight="700" fill="#0E7988">F · 熟悉度</text>
<text x="72" y="291" font-size="17" font-weight="600" fill="#10213A">有多熟悉</text>
<text x="72" y="320" font-size="15" font-weight="400" fill="#0E7988">陌生 · 眼熟 · 相识 · 熟悉 · 熟络</text>
<text x="72" y="349" font-size="14" font-weight="400" fill="#465978">0～100；久不互动时可向基线淡化</text>
<rect x="56" y="386" width="320" height="140" rx="12" fill="#F2F6FC" stroke="#CFDCEB"/>
<text x="72" y="416" font-size="18" font-weight="700" fill="#1B4480">A · 亲近度</text>
<text x="72" y="445" font-size="17" font-weight="600" fill="#10213A">相处时的亲疏</text>
<text x="72" y="474" font-size="15" font-weight="400" fill="#1B4480">疏远 · 疏淡 · 平和 · 亲近 · 亲密</text>
<text x="72" y="503" font-size="14" font-weight="400" fill="#465978">−100～100；可亲近，也可疏远</text>
<rect x="56" y="540" width="320" height="140" rx="12" fill="#FCF9F2" stroke="#CFDCEB"/>
<text x="72" y="570" font-size="18" font-weight="700" fill="#9E7322">T · 信任度</text>
<text x="72" y="599" font-size="17" font-weight="600" fill="#10213A">放心还是戒备</text>
<text x="72" y="628" font-size="15" font-weight="400" fill="#9E7322">戒备 · 谨慎 · 保留 · 放心 · 信赖</text>
<text x="72" y="657" font-size="14" font-weight="400" fill="#465978">−100～100；不由亲近度代替</text>
<rect x="440" y="232" width="320" height="70" rx="12" fill="#F2F6FC" stroke="#CFDCEB"/>
<text x="456" y="259" font-size="18" font-weight="700" fill="#1B4480">陌生</text>
<text x="456" y="285" font-size="15" font-weight="400" fill="#465978">初始三维均为 0，尚未熟悉。</text>
<rect x="440" y="313" width="320" height="70" rx="12" fill="#F2F6FC" stroke="#CFDCEB"/>
<text x="456" y="340" font-size="18" font-weight="700" fill="#1B4480">亲近却戒备</text>
<text x="456" y="366" font-size="15" font-weight="400" fill="#465978">有亲近感，也保留着戒心。</text>
<rect x="440" y="394" width="320" height="70" rx="12" fill="#F2F6FC" stroke="#CFDCEB"/>
<text x="456" y="421" font-size="18" font-weight="700" fill="#1B4480">疏远但信赖</text>
<text x="456" y="447" font-size="15" font-weight="400" fill="#465978">相处不热络，仍认可对方可靠。</text>
<rect x="440" y="475" width="320" height="70" rx="12" fill="#F2F6FC" stroke="#CFDCEB"/>
<text x="456" y="502" font-size="18" font-weight="700" fill="#1B4480">亲密而保留</text>
<text x="456" y="528" font-size="15" font-weight="400" fill="#465978">熟悉且亲近，信任仍有所保留。</text>
<rect x="440" y="556" width="320" height="70" rx="12" fill="#F2F6FC" stroke="#CFDCEB"/>
<text x="456" y="583" font-size="18" font-weight="700" fill="#1B4480">亲密挚友</text>
<text x="456" y="609" font-size="15" font-weight="400" fill="#465978">熟悉、亲近和信任都较强。</text>
<text x="440" y="674" font-size="15" font-weight="400" fill="#465978">这些是并列状态，不是升级路线。</text>
<rect x="824" y="232" width="320" height="140" rx="12" fill="#F2F6FC" stroke="#CFDCEB"/>
<text x="840" y="262" font-size="18" font-weight="700" fill="#1B4480">回复参考关系</text>
<text x="840" y="292" font-size="15" font-weight="400" fill="#465978">开启后，回复可参考关系与印象。</text>
<text x="840" y="318" font-size="15" font-weight="400" fill="#465978">如何措辞，仍由当前人格决定。</text>
<text x="840" y="344" font-size="15" font-weight="400" fill="#465978">默认关闭，可在基础设置开启。</text>
<rect x="824" y="386" width="320" height="140" rx="12" fill="#F2F8FA" stroke="#CFDCEB"/>
<text x="840" y="416" font-size="18" font-weight="700" fill="#0E7988">后台评估互动</text>
<text x="840" y="446" font-size="15" font-weight="400" fill="#465978">先选择评估模型，再开启自动评估。</text>
<text x="840" y="472" font-size="15" font-weight="400" fill="#465978">后台评估不阻塞正常回复。</text>
<text x="840" y="498" font-size="15" font-weight="400" fill="#465978">模型判断互动，本地规则计算变化。</text>
<rect x="824" y="540" width="320" height="140" rx="12" fill="#FCF9F2" stroke="#CFDCEB"/>
<text x="840" y="570" font-size="18" font-weight="700" fill="#9E7322">积累印象与标签</text>
<text x="840" y="600" font-size="15" font-weight="400" fill="#465978">默认累计 8 条未汇总有效评估，</text>
<text x="840" y="626" font-size="15" font-weight="400" fill="#465978">在关系变化后尝试更新印象。</text>
<text x="840" y="652" font-size="15" font-weight="400" fill="#465978">按群空间与全局空间均支持。</text>
<text x="36" y="743" font-size="14" font-weight="400" fill="#465978">关系描述属于当前 Bot 的视角，不代表成员的内心，也不改变人格原则或权限。</text>
</svg>